<div class="h-full">
  <div>
    <h1>Add New Stylist</h1>
    <hr />
  </div>
  <div class="mt-3 h-auto min-h-[calc(100vh-160px)] boundary">
    <div class="w-full h-full flex">
      <mat-card class="w-full">
        <mat-card-content>
          <form [formGroup]="formData">
            <div class="flex gap-3 flex-wrap">
              <mat-form-field class="w-full md:w-[calc(33.3%-12px)]">
                <mat-label>Name</mat-label>
                <input
                  matInput
                  placeholder="Enter the stylist name"
                  formControlName="name"
                />
              </mat-form-field>

              <mat-form-field class="w-full md:w-[calc(33.3%-12px)]">
                <mat-label>Gender</mat-label>
                <mat-select
                  #mode
                  value="side"
                  placeholder="Select Gender"
                  formControlName="gender"
                >
                  <mat-option value="male">Male</mat-option>
                  <mat-option value="female">Female</mat-option>
                  <mat-option value="others">Others</mat-option>
                </mat-select>
              </mat-form-field>

              <mat-form-field class="w-full md:w-[calc(34%-12px)]">
                <mat-label>Date of Birth</mat-label>
                <input
                  matInput
                  [matDatepicker]="picker"
                  [max]="currentDate"
                  placeholder="MM/DD/YYYY"
                  formControlName="dateofbirth"
                />
                <mat-datepicker-toggle
                  matIconSuffix
                  [for]="picker"
                ></mat-datepicker-toggle>
                <mat-datepicker #picker></mat-datepicker>
              </mat-form-field>

              <mat-form-field class="w-full md:w-[calc(33.3%-12px)]">
                <mat-label>Experience</mat-label>
                <input
                  type="number"
                  matInput
                  placeholder="Enter the stylist Experience"
                  formControlName="experience"
                />
              </mat-form-field>

              <mat-form-field class="w-full md:w-[calc(33.3%-12px)]">
                <mat-label>stylist level</mat-label>
                <mat-select
                  #mode
                  value="side"
                  placeholder="Select stylist level"
                  formControlName="level"
                >
                  <mat-option value="apprentice">Apprentice</mat-option>
                  <mat-option value="junior">junior stylist</mat-option>
                  <mat-option value="senior">Senior stylist</mat-option>
                  <mat-option value="master">Master stylist</mat-option>
                </mat-select>
              </mat-form-field>

              <mat-form-field class="w-full md:w-[calc(34%-12px)]">
                <mat-label>Specialization</mat-label>
                <mat-select
                  multiple
                  placeholder="Choose Specialization"
                  formControlName="specialization"
                >
                  <mat-option disabled>choose specialization</mat-option>
                  <mat-option
                    *ngFor="let specialization of dropdownItem"
                    [value]="specialization"
                    >{{ specialization }}</mat-option
                  >
                </mat-select>
              </mat-form-field>

              <button
                (click)="onSubmit()"
                [disabled]="formData.invalid"
                mat-raised-button
                color="primary"
              >
                Submit
              </button>
            </div>
          </form>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
