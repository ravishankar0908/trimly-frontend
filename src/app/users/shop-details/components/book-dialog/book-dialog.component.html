<div class="p-5">
  <div class="flex justify-between items-center mb-5">
    <span class="items-center text-2xl">Confirm Booking</span>
    <button (click)="closeDialog()" class="">
      <mat-icon class="hover:cursor-pointer">close</mat-icon>
    </button>
  </div>

  <mat-form-field>
    <mat-label>Stylist Name</mat-label>
    <input
      matInput
      placeholder="Enter the stylist name"
      disabled
      [(ngModel)]="data.name"
    />
  </mat-form-field>

  <form [formGroup]="formData">
    <mat-form-field>
      <mat-label>Choose a date</mat-label>
      <input
        matInput
        [matDatepicker]="picker"
        [min]="currDate"
        (dateChange)="ondateChange($event)"
        formControlName="appoinmentDate"
        placeholder="Select your date"
      />
      <mat-datepicker-toggle
        matIconSuffix
        [for]="picker"
      ></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
    <div class="flex gap-2">
      <mat-form-field>
        <mat-label>Select Time Slot</mat-label>
        <mat-select formControlName="appoinmentTime">
          <mat-option *ngFor="let time of timeSlots" [value]="time">
            {{ time }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </form>
  <button
    (click)="bookStylist(data.id)"
    mat-raised-button
    [disabled]="formData.invalid"
    color="primary"
    class="w-full"
  >
    Book
  </button>
  <button
    mat-raised-button
    (click)="closeDialog()"
    class="w-full !bg-red-600 !text-white mt-2"
  >
    Cancel
  </button>
</div>
